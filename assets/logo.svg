<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="water" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#7BC1E5"/>
      <stop offset="55%" stop-color="#1FA0E3"/>
      <stop offset="100%" stop-color="#0B5C8A"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0B5C8A"/>
      <stop offset="100%" stop-color="#063C5C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- subtle drop shadow under the pool -->
  <ellipse cx="128" cy="226" rx="92" ry="9" fill="#000" opacity="0.10"/>

  <!-- outer rim (concrete/coping look) -->
  <circle cx="128" cy="128" r="108" fill="url(#rim)"/>

  <!-- water body -->
  <circle cx="128" cy="128" r="96" fill="url(#water)"/>

  <!-- highlight band on the water -->
  <path d="M 60 100 q 35 -22 95 -10 q 28 6 38 0"
        stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"
        fill="none" stroke-linecap="round" filter="url(#soft)"/>

  <!-- ripple arcs -->
  <path d="M 78 140 q 25 -10 50 0 t 50 0"
        stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3.2"
        fill="none" stroke-linecap="round"/>
  <path d="M 86 168 q 21 -8 42 0 t 42 0"
        stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- pump symbol (bottom-right, stylized rotor) -->
  <g transform="translate(190 190)">
    <circle r="28" fill="#FFFFFF"/>
    <circle r="28" fill="none" stroke="#0B5C8A" stroke-width="3"/>
    <!-- 3-blade rotor -->
    <g fill="#1FA0E3">
      <path d="M 0 -16 a 8 8 0 0 1 6 12 l -6 4 l -6 -4 a 8 8 0 0 1 6 -12 z"/>
      <g transform="rotate(120)">
        <path d="M 0 -16 a 8 8 0 0 1 6 12 l -6 4 l -6 -4 a 8 8 0 0 1 6 -12 z"/>
      </g>
      <g transform="rotate(240)">
        <path d="M 0 -16 a 8 8 0 0 1 6 12 l -6 4 l -6 -4 a 8 8 0 0 1 6 -12 z"/>
      </g>
    </g>
    <circle r="4" fill="#0B5C8A"/>
  </g>
</svg>
