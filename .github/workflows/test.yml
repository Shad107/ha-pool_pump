name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Smoke-import the integration
        # Catches NameError / declaration-order bugs like v0.12.0
        # before they reach a release.
        run: |
          python -c "from custom_components.pool_pump import const; \
            assert len(const.ROUTINES) >= 1; \
            print(f'const loads, {len(const.ROUTINES)} routines, {len(const.CHEM_PARAMS)} chem params')"

      - name: Run tests
        run: pytest tests/ -v --tb=short
