# Pool Pump Manager services

refresh:
  name: Refresh
  description: Recompute the schedule and reapply the pump/electrolyzer state immediately.

backwash:
  name: Start filter backwash
  description: Force the pump ON and the electrolyzer OFF for a fixed duration, then return to automatic mode. Use after a filter clean or to flush a fresh dose of chemicals.
  fields:
    duration_minutes:
      name: Duration (minutes)
      description: How long to keep the pump ON with the cell OFF. Defaults to the value set in the integration options (5 min if not changed).
      example: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box

cancel_backwash:
  name: Cancel backwash
  description: Stop an in-progress backwash cycle and return to automatic mode.

reset_water_model:
  name: Reset water temperature model
  description: Reset or seed the air-based water temperature model. When provided with a value, also records a calibration point so the model self-tunes its bias over time.
  fields:
    water_temperature:
      name: Water temperature (°C, optional)
      description: If provided, force the model to this temperature AND record a calibration point. Over multiple uses the integration learns a temperature offset to correct systematic bias.
      example: 22.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          mode: box

clear_calibration:
  name: Clear learned calibration
  description: Forget all calibration points and reset the learned temperature offset to 0. Use if past calibrations were wrong or you want to start fresh.

set_chemistry:
  name: Set chemistry readings
  description: Update one or more chemistry parameters (pH, chlorine, TAC...) and refresh the diagnosis. Use after a test strip / probe reading.
  fields:
    ph:
      name: pH
      example: 7.4
      selector: {number: {min: 0, max: 14, step: 0.1, mode: box}}
    free_chlorine:
      name: Free chlorine (ppm)
      example: 2.0
      selector: {number: {min: 0, max: 20, step: 0.1, mode: box}}
    total_chlorine:
      name: Total chlorine (ppm)
      example: 2.0
      selector: {number: {min: 0, max: 20, step: 0.1, mode: box}}
    tac:
      name: Total alkalinity / TAC (ppm)
      example: 100
      selector: {number: {min: 0, max: 300, step: 10, mode: box}}
    th:
      name: Total hardness / TH (ppm)
      example: 200
      selector: {number: {min: 0, max: 1000, step: 10, mode: box}}
    cya:
      name: Cyanuric acid / CYA (ppm)
      example: 40
      selector: {number: {min: 0, max: 300, step: 5, mode: box}}
    salt:
      name: Salt (ppm)
      example: 4000
      selector: {number: {min: 0, max: 6000, step: 50, mode: box}}
    orp:
      name: ORP / redox (mV)
      example: 700
      selector: {number: {min: 0, max: 1000, step: 10, mode: box}}

maintenance_start:
  name: Start maintenance cycle
  description: Force pump ON + cell OFF for a duration (default 3h). Used after manual chemical dosing to mix the products. Auto-reverts to AUTO at the end.
  fields:
    duration_minutes:
      name: Duration (minutes)
      example: 180
      selector: {number: {min: 30, max: 1440, step: 30, mode: box}}

maintenance_cancel:
  name: Cancel maintenance cycle
  description: Stop an in-progress maintenance cycle and return to AUTO immediately.

start_routine:
  name: Start a preset routine
  description: Trigger one of the preset chemistry/pump routines (chlore choc, boost cellule, mix, etc.). Smart routines auto-compute their dose + duration from the live chemistry diagnosis.
  fields:
    routine_key:
      name: Routine
      description: Internal key of the routine
      required: true
      example: shock_chlorine
      selector:
        select:
          options:
            - shock_chlorine
            - boost_cell
            - mix
            - ph_adjust
            - tac_adjust
            - stabilizer_dissolve
