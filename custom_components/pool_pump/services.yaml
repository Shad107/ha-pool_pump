# Pool Pump Manager services

refresh:
  name: Refresh
  description: Recompute the schedule and reapply the pump/electrolyzer state immediately.

backwash:
  name: Start filter backwash
  description: Force the pump ON and the electrolyzer OFF for a fixed duration, then return to automatic mode. Use after a filter clean or to flush a fresh dose of chemicals.
  fields:
    duration_minutes:
      name: Duration (minutes)
      description: How long to keep the pump ON with the cell OFF. Defaults to the value set in the integration options (5 min if not changed).
      example: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box

cancel_backwash:
  name: Cancel backwash
  description: Stop an in-progress backwash cycle and return to automatic mode.

reset_water_model:
  name: Reset water temperature model
  description: Reset or seed the air-based water temperature model. Useful after install when the bootstrap was biased (e.g., installed at peak air temperature) or when you measured the real water temperature manually.
  fields:
    water_temperature:
      name: Water temperature (°C, optional)
      description: If provided, force the model to start from this temperature. If omitted, the model is reset and re-bootstraps from the next air sample.
      example: 22.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          mode: box
