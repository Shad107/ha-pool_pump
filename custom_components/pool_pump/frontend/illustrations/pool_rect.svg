<?xml version="1.0" encoding="UTF-8"?>
<!-- Above-ground rectangular pool, 3/4 axonometric view, matching the
     style of pool_round.svg (openclipart 316492 by laobc). Hand-drawn
     for Pool Pump Manager. Free for any use. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 366" width="620" height="366">
  <defs>
    <!-- Vertical white stripe pattern for the front/right walls (Intex-style frame) -->
    <pattern id="poolStripes" x="0" y="0" width="62" height="20" patternUnits="userSpaceOnUse">
      <rect width="62" height="20" fill="#2586A6"/>
      <rect x="7" y="0" width="3" height="20" fill="#FFFFFE"/>
      <rect x="55" y="0" width="3" height="20" fill="#FFFFFE"/>
    </pattern>
    <!-- Vertical stripes for the receding (left) wall, slightly darker -->
    <pattern id="poolStripesSide" x="0" y="0" width="62" height="20" patternUnits="userSpaceOnUse">
      <rect width="62" height="20" fill="#20718D"/>
      <rect x="7" y="0" width="3" height="20" fill="#E8F4F8"/>
      <rect x="55" y="0" width="3" height="20" fill="#E8F4F8"/>
    </pattern>
  </defs>

  <!-- Grass oval (shadow under the pool) -->
  <ellipse cx="310" cy="294" rx="310" ry="62" fill="#B3CF38"/>

  <!-- Pool front wall (rectangle in 3/4 perspective) -->
  <!-- Coordinates : top-back-left → top-back-right → bottom-back-right → bottom-front-right → bottom-front-left → top-front-left -->
  <!-- Back-left wall (left receding face, partially visible) -->
  <polygon points="80,160 150,135 150,265 80,290" fill="url(#poolStripesSide)" stroke="#1a5a72" stroke-width="1"/>
  <!-- Front wall (largest, facing viewer) -->
  <polygon points="150,265 530,265 530,290 150,290" fill="url(#poolStripes)" stroke="#1a5a72" stroke-width="1"/>
  <!-- Right side wall (right receding) -->
  <polygon points="530,265 530,290 600,265 600,240" fill="url(#poolStripesSide)" stroke="#1a5a72" stroke-width="1"/>

  <!-- Top rim — the white coping around the pool edge -->
  <polygon points="80,160 150,135 540,135 600,160 530,170 150,170" fill="#FFFFFE" stroke="#888888" stroke-width="1"/>
  <polygon points="600,160 530,170 530,265 600,240" fill="#E8E8E8" stroke="#888888" stroke-width="1"/>

  <!-- Water surface (inner rectangle, light blue) -->
  <polygon class="pool-water" points="150,170 530,170 530,265 150,265" fill="#7CCBE5" stroke="#2586A6" stroke-width="1"/>
  <!-- Subtle water highlight (whiter shape in the middle for shimmer) -->
  <polygon points="200,185 480,185 470,250 190,250" fill="#A3D8E9" opacity="0.6"/>
  <polygon points="260,200 420,200 415,235 255,235" fill="#BCE2EC" opacity="0.5"/>

  <!-- Ladder (yellow/orange, climbing over the right wall) -->
  <g stroke="#F3B528" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Two vertical rails leaning over the wall -->
    <path d="M495,120 L485,180 L485,260"/>
    <path d="M515,120 L505,180 L505,260"/>
    <!-- Rungs on the outside (top) -->
    <line x1="487" y1="140" x2="513" y2="140"/>
    <line x1="486" y1="155" x2="512" y2="155"/>
    <line x1="485" y1="170" x2="510" y2="170"/>
    <!-- Rungs on the inside (underwater) -->
    <line x1="485" y1="200" x2="505" y2="200"/>
    <line x1="485" y1="220" x2="505" y2="220"/>
    <line x1="485" y1="240" x2="505" y2="240"/>
  </g>
</svg>
